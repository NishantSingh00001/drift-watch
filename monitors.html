<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Monitors — DriftWatch</title><meta name="description" content="Every monitored model at a glance: drift score, health, features drifting and prediction volume.">
<link rel="stylesheet" href="core.css"><link rel="stylesheet" href="app.css"></head><body><div id="topbar"></div>
<main class="shell page">
  <header class="phead"><div class="eyebrow">Monitors</div><h1>What's <em>drifting</em>.</h1><p class="lede">Ranked by drift. Click any model for per-feature PSI & KS, drift history and performance decay.</p></header>
  <div class="bigstats" id="summary"></div>
  <div class="row" style="justify-content:space-between;margin-bottom:18px">
    <label class="pill" style="gap:10px;cursor:text"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="Search models…" style="background:none;border:none;outline:none;color:var(--ink);width:150px"></label>
    <div class="seg" id="sortseg"><button class="on" data-s="drift">Drift</button><button data-s="acc">Accuracy</button><button data-s="name">Name</button></div>
  </div>
  <div class="mgrid" id="grid"></div>
</main><script src="three.min.js"></script><script src="app.js"></script><script src="core.js"></script></body></html>
